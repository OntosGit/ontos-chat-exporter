name: ONTOS Chat Exporter Tests
on:
  # Automatic owner-reviewed tests run through the existing Runner25
  # with exact-source ontos/portfolio-runner25 status on the source commit.
  # Do not schedule hosted Ubuntu on every PR or push.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate extension and run synthetic tests
        run: |
          node --check extension/checkpoints.js
          node --check extension/live.js
          node --check extension/content.js
          node --check extension/popup.js
          node --test tests/*.test.cjs
